strategy:
  # TDF/BIL로만 안전 슬리브를 구성하는 Gate SPY 전략이다.
  id: profit-band-tdf2050-gate-spy-tdf100-no-bnd
  name: Profit Band TDF 2050 Gate SPY TDF 100 No BND
  version: 1
  dsl_version: 1
  enabled: false

assets:
  required: [QQQ, TDF2050_PROXY, BIL]
  observations: [SPY]
  risk: [QQQ]

parameters:
  canonical_risk_weight: 0.70
  upper_risk_weight: 0.775
  caution_risk_cap: 0.75

variables:
  risk_off_score: >
    count(
      QQQ.close < QQQ.ema20,
      QQQ.close < QQQ.ema55,
      QQQ.ema20 < QQQ.ema55,
      QQQ.roc5 < 0,
      QQQ.roc20 < 0,
      QQQ.ema20_slope5 < 0
    )

  recovery_score: >
    count(
      QQQ.close > QQQ.ema20,
      QQQ.close > QQQ.ema55,
      QQQ.ema20 > QQQ.ema55,
      QQQ.roc5 > 0,
      QQQ.roc20 > 0,
      QQQ.ema20_slope5 > 0
    )

  structural_bear: >
    variables.risk_off_score >= 5
    and QQQ.close < QQQ.ema20
    and QQQ.ema20 < QQQ.ema55
    and QQQ.ema55 < QQQ.ema200
    and QQQ.roc60 < 0
    and QQQ.ema200_slope20 < 0

  bull_reentry_allowed: >
    QQQ.close > QQQ.ema55
    and QQQ.roc60 > 0

  qqq_inside_profit_band: >
    portfolio.weight.QQQ > parameters.canonical_risk_weight
    and portfolio.weight.QQQ < parameters.upper_risk_weight

state:
  # VXUS2의 네 상태 전이 규칙을 그대로 사용한다.
  market_mode:
    initial: UNINITIALIZED
    rules:
      - when: state.market_mode == 'UNINITIALIZED' and variables.structural_bear
        set: BEAR
      - when: state.market_mode == 'UNINITIALIZED' and variables.risk_off_score >= 5
        set: CAUTION
      - when: state.market_mode == 'UNINITIALIZED'
        set: BULL

      - when: state.market_mode == 'BULL' and variables.structural_bear
        set: BEAR
        confirm: 10
      # 1단계: QQQ가 단기 추세 아래이고 기존 위험회피 조건을 3개 이상
      # 충족해야 한다. 2단계: SPY가 약세를 확인한다.
      - when: >
          state.market_mode == 'BULL'
          and QQQ.close < QQQ.ema20
          and variables.risk_off_score >= 3
          and SPY.close < SPY.ema20
          and SPY.roc5 <= -1
        set: CAUTION
        confirm: 1

      - when: state.market_mode == 'CAUTION' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: state.market_mode == 'CAUTION' and variables.recovery_score >= 4
        set: BULL
        confirm: 3

      - when: state.market_mode == 'BEAR' and variables.recovery_score >= 3
        set: RECOVERY
        confirm: 2

      - when: state.market_mode == 'RECOVERY' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.market_mode == 'RECOVERY'
          and variables.recovery_score >= 4
          and variables.bull_reentry_allowed
        set: BULL
        confirm: 3
      - when: state.market_mode == 'RECOVERY' and variables.risk_off_score >= 5
        set: CAUTION
        confirm: 3

  risk_weight:
    initial: 70%
    rules:
      - {when: state.market_mode == 'BEAR', set: 0%}
      - {when: state.market_mode == 'RECOVERY', set: 50%}
      - {when: "state.market_mode in ['BULL', 'CAUTION']", set: 70%}

  execution_days:
    initial: 1
    rules:
      - {when: state.market_mode == 'BEAR', set: 1}
      - {when: state.market_mode == 'CAUTION', set: 2}
      - {when: state.market_mode == 'RECOVERY', set: 3}
      - {when: state.market_mode == 'BULL', set: 5}

  # 회복이 확인되면 비-QQQ 슬리브 전체를 TDF로 복원한다.
  safe_tdf_share:
    initial: 100%
    rules:
      - when: >
          state.market_mode == 'CAUTION'
          and state.safe_tdf_share > 0
          and variables.risk_off_score >= 5
        set: 0%
      - when: >
          state.safe_tdf_share == 0
          and variables.recovery_score >= 3
        set: 100%
        confirm: 2
      - otherwise: true
        set: "= state.safe_tdf_share"

target:
  # BULL에서는 QQQ 수익 비중을 보존하고 CAUTION에서는 75% 상한까지만 허용한다.
  - when: >
      (
        state.market_mode == 'BULL'
        or (
          state.market_mode == 'CAUTION'
          and portfolio.weight.QQQ <= parameters.caution_risk_cap
        )
      )
      and variables.qqq_inside_profit_band
    weights:
      QQQ: portfolio.weight.QQQ
      TDF2050_PROXY: >
        round((1 - portfolio.weight.QQQ) * state.safe_tdf_share, 10)
      BIL: >
        round(
          (1 - portfolio.weight.QQQ) * (1 - state.safe_tdf_share),
          10
        )

  - weights:
      QQQ: state.risk_weight
      TDF2050_PROXY: >
        round((1 - state.risk_weight) * state.safe_tdf_share, 10)
      BIL: >
        round(
          (1 - state.risk_weight) * (1 - state.safe_tdf_share),
          10
        )

rebalance:
  - when: >
      (
        state.market_mode == 'BULL'
        and portfolio.weight.QQQ >= parameters.upper_risk_weight
      )
      or (
        state.market_mode == 'CAUTION'
        and portfolio.weight.QQQ > parameters.caution_risk_cap
      )
    days: state.execution_days

  - when: >
      changed(state.market_mode)
      and not (
        (
          state.market_mode == 'BULL'
          or (
            state.market_mode == 'CAUTION'
            and portfolio.weight.QQQ <= parameters.caution_risk_cap
          )
        )
        and variables.qqq_inside_profit_band
      )
      and not (
        previous(state.market_mode) == 'CAUTION'
        and state.market_mode == 'BULL'
      )
      and target_deviation() >= 2%
    days: state.execution_days

  - when: >
      changed(state.market_mode)
      and not (
        (
          state.market_mode == 'BULL'
          or (
            state.market_mode == 'CAUTION'
            and portfolio.weight.QQQ <= parameters.caution_risk_cap
          )
        )
        and variables.qqq_inside_profit_band
      )
      and previous(state.market_mode) == 'CAUTION'
      and state.market_mode == 'BULL'
      and (
        changed(state.safe_tdf_share)
        or target_deviation() >= 5%
      )
      and target_deviation() >= 2%
    days: state.execution_days

  - when: changed(state.safe_tdf_share)
    days: 1

  - check: monthly
    when: >
      not (
        (
          state.market_mode == 'BULL'
          or (
            state.market_mode == 'CAUTION'
            and portfolio.weight.QQQ <= parameters.caution_risk_cap
          )
        )
        and variables.qqq_inside_profit_band
      )
      and target_deviation() >= 5%
    days: state.execution_days

execution:
  days: state.execution_days
