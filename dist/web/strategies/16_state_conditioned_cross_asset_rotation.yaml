strategy:
  id: state-conditioned-cross-asset-rotation
  name: State-conditioned cross-asset rotation
  version: 7
  dsl_version: 1
  enabled: false

assets:
  required:
    - QQQ
    - TDF2050_PROXY
    - BIL
    - GLD
    - SHY
    - IEF
    - 114100.KS
    - 148070.KS
    - 069500.KS
    - VEA
    - VWO
  observations: [SPY]
  # 주식성 자산의 합계는 로테이션 후에도 70%를 넘지 않는다.
  risk: [QQQ, 069500.KS, VEA, VWO]

variables:
  risk_off_score: >
    count(
      QQQ.close < QQQ.ema20,
      QQQ.close < QQQ.ema55,
      QQQ.ema20 < QQQ.ema55,
      QQQ.roc5 < 0,
      QQQ.roc20 < 0,
      QQQ.ema20_slope5 < 0
    )

  recovery_score: >
    count(
      QQQ.close > QQQ.ema20,
      QQQ.close > QQQ.ema55,
      QQQ.ema20 > QQQ.ema55,
      QQQ.roc5 > 0,
      QQQ.roc20 > 0,
      QQQ.ema20_slope5 > 0
    )

  structural_bear: >
    variables.risk_off_score >= 5
    and QQQ.close < QQQ.ema20
    and QQQ.ema20 < QQQ.ema55
    and QQQ.ema55 < QQQ.ema200
    and QQQ.roc60 < 0
    and QQQ.ema200_slope20 < 0

  bull_reentry_allowed: >
    QQQ.close > QQQ.ema55
    and QQQ.roc60 > 0

state:
  market_mode:
    initial: UNINITIALIZED
    rules:
      - when: state.market_mode == 'UNINITIALIZED' and variables.structural_bear
        set: BEAR
      - when: state.market_mode == 'UNINITIALIZED' and variables.risk_off_score >= 5
        set: CAUTION
      - when: state.market_mode == 'UNINITIALIZED'
        set: BULL

      - when: state.market_mode == 'BULL' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.market_mode == 'BULL'
          and QQQ.close < QQQ.ema20
          and variables.risk_off_score >= 3
          and SPY.close < SPY.ema20
          and SPY.roc5 <= -1
        set: CAUTION

      - when: state.market_mode == 'CAUTION' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: state.market_mode == 'CAUTION' and variables.recovery_score >= 4
        set: BULL
        confirm: 3

      - when: state.market_mode == 'BEAR' and variables.recovery_score >= 3
        set: RECOVERY
        confirm: 3

      - when: state.market_mode == 'RECOVERY' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.market_mode == 'RECOVERY'
          and variables.recovery_score >= 4
          and variables.bull_reentry_allowed
        set: BULL
        confirm: 3
      - when: state.market_mode == 'RECOVERY' and variables.risk_off_score >= 5
        set: CAUTION
        confirm: 3

target:
  # BEAR 확인을 기다리는 동안에는 위험자산을 먼저 줄이고 BIL을 유지한다.
  - when: >
      state.market_mode != 'BEAR'
      and variables.structural_bear
    weights:
      QQQ: 0%
      TDF2050_PROXY: 0%
      BIL: 100%

  - when: state.market_mode == 'BEAR'
    weights:
      QQQ: 0%
      TDF2050_PROXY: 20%
      BIL: 80%

  - when: state.market_mode == 'RECOVERY'
    weights:
      QQQ: 60%
      TDF2050_PROXY: 30%
      BIL: 10%

  - weights:
      QQQ: 70%
      TDF2050_PROXY: 30%
      BIL: 0%

rotation:
  # structural_bear 방어 중에는 후보 교체를 멈추고 BIL을 그대로 유지한다.
  replace: BIL
  review: monthly
  suspend_when: variables.structural_bear
  # 장기 지표가 준비된 자산부터 자동으로 비교 대상에 포함한다.
  assets: [GLD, SHY, IEF, 114100.KS, 148070.KS, 069500.KS, VEA, VWO]

rebalance:
  - check: daily
    when: target_deviation() >= 7.5%

execution:
  days: 1
