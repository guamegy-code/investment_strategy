strategy:
  id: qqq-valuation-breakdown-balanced
  name: QQQ Valuation Breakdown Balanced (25) [BIL]
  version: 1
  dsl_version: 1
  enabled: true

# 25번은 24번의 월간 밸류에이션 급락 신호와 23번의 추세 안전 상한을 유지하면서,
# 급락 진입 속도·DEFENSE 강도·회복 속도를 균형형으로 조정한 개인연금용 QQQ/BIL 전략이다.
#
# 두 단계 방어 진입
# - 합성점수가 65 이상인 주기 고점 대비 25점 이상 하락하면 일반적으로 WARNING으로 전환한다.
# - 같은 날 여섯 약세 조건이 모두 충족되면 월간 신호의 추가 지연을 줄이기 위해 곧바로 DEFENSE가 된다.
# - 즉시 진입 조건이 아니면 WARNING에서 risk_off_score 4 이상을 6거래일 연속 확인한다.
#
# 균형형 방어와 회복
# - DEFENSE에서는 QQQ 30%, BIL 70%를 목표로 하여 24번보다 하방 방어를 강화한다.
# - recovery_score 4 이상과 QQQ의 EMA20 상향 회복이 2거래일 이어지면 NORMAL로 복귀한다.
# - NORMAL 복귀일의 점수로 밸류에이션 고점을 초기화하여 새로운 방어 주기를 시작한다.
#
# 추세 안전 상한
# - 23번의 BEAR 확정은 QQQ 0%, 구조적 약세 사전 경보는 QQQ 50%, RECOVERY는 QQQ 80%다.
# - 밸류에이션 목표와 추세 목표가 겹치면 QQQ 비중이 더 낮은 쪽을 우선한다.
# - 신호는 당일 종가로 판정하고 주문은 다음 거래일 시가부터 1일에 걸쳐 실행한다.
assets:
  required: [QQQ, BIL]
  observations: [SPY]
  risk: [QQQ]

parameters:
  # 22번 합성점수의 고평가 진입선과 한 방어 주기 내 고점 대비 붕괴 폭이다.
  valuation_arm_score: 65
  valuation_breakdown_points: 25

variables:
  # 아래 여섯 약세 조건 중 충족 개수를 센다. 6점은 극단 약세 즉시 진입에 사용한다.
  risk_off_score: >
    count(
      QQQ.close < QQQ.ema20,
      QQQ.close < QQQ.ema55,
      QQQ.ema20 < QQQ.ema55,
      QQQ.roc5 < 0,
      QQQ.roc20 < 0,
      QQQ.ema20_slope5 < 0
    )

  # risk_off_score와 반대 방향인 여섯 회복 조건의 충족 개수를 센다.
  recovery_score: >
    count(
      QQQ.close > QQQ.ema20,
      QQQ.close > QQQ.ema55,
      QQQ.ema20 > QQQ.ema55,
      QQQ.roc5 > 0,
      QQQ.roc20 > 0,
      QQQ.ema20_slope5 > 0
    )

  # 장기 하락 추세가 정렬된 경우에만 23번의 확정 BEAR 후보로 본다.
  structural_bear: >
    variables.risk_off_score >= 5
    and QQQ.close < QQQ.ema20
    and QQQ.ema20 < QQQ.ema55
    and QQQ.ema55 < QQQ.ema200
    and QQQ.roc60 < 0
    and QQQ.ema200_slope20 < 0

  bull_reentry_allowed: >
    QQQ.close > QQQ.ema55
    and QQQ.roc60 > 0

state:
  # 밸류에이션이 주도하는 대표 상태다.
  defense_mode:
    initial: NORMAL
    rules:
      # 월간 밸류에이션 급락과 여섯 약세 조건이 동시에 확인되면 WARNING을 건너뛴다.
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
          and variables.risk_off_score >= 6
        set: DEFENSE

      # 극단 약세가 아니면 기존 24번처럼 WARNING에서 일별 약세를 추가 확인한다.
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
        set: WARNING

      # WARNING 이후 점수가 기존 주기 고점을 회복하면 오경보로 보고 정상화한다.
      - when: >
          state.defense_mode == 'WARNING'
          and QQQ.valuation_score >= state.valuation_peak
        set: NORMAL

      # 일반 WARNING은 실제 가격 약세가 6거래일 이어질 때 방어한다.
      - when: >
          state.defense_mode == 'WARNING'
          and variables.risk_off_score >= 4
        set: DEFENSE
        confirm: 6

      # 방어 강도를 높인 대신 회복 확인은 2거래일로 줄여 반등 참여 지연을 제한한다.
      - when: >
          state.defense_mode == 'DEFENSE'
          and variables.recovery_score >= 4
          and QQQ.close > QQQ.ema20
        set: NORMAL
        confirm: 2

  # 한 방어 주기 안에서 관측된 합성 밸류에이션 점수의 고점이다.
  valuation_peak:
    initial: 0
    rules:
      # 최초 유효 점수를 기준 고점으로 저장한다.
      - when: state.valuation_peak == 0
        set: "=QQQ.valuation_score"

      # DEFENSE 종료나 WARNING 취소로 NORMAL에 복귀하면 새 주기를 시작한다.
      - when: changed(state.defense_mode) and state.defense_mode == 'NORMAL'
        set: "=QQQ.valuation_score"

      # NORMAL 상태에서만 고점을 올린다. WARNING·DEFENSE 중에는 기준을 고정한다.
      - when: >
          state.defense_mode == 'NORMAL'
          and QQQ.valuation_score > state.valuation_peak
        set: "=QQQ.valuation_score"

  # 23번의 네 가지 추세 상태를 별도 안전 상한으로 그대로 유지한다.
  trend_mode:
    initial: UNINITIALIZED
    rules:
      - when: state.trend_mode == 'UNINITIALIZED' and variables.structural_bear
        set: BEAR
      - when: state.trend_mode == 'UNINITIALIZED' and variables.risk_off_score >= 5
        set: CAUTION
      - when: state.trend_mode == 'UNINITIALIZED'
        set: BULL

      - when: state.trend_mode == 'BULL' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'BULL'
          and QQQ.close < QQQ.ema20
          and variables.risk_off_score >= 3
          and SPY.close < SPY.ema20
          and SPY.roc5 <= -1
        set: CAUTION
        confirm: 1

      - when: state.trend_mode == 'CAUTION' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: state.trend_mode == 'CAUTION' and variables.recovery_score >= 4
        set: BULL
        confirm: 3

      - when: state.trend_mode == 'BEAR' and variables.recovery_score >= 3
        set: RECOVERY
        confirm: 3

      - when: state.trend_mode == 'RECOVERY' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'RECOVERY'
          and variables.recovery_score >= 4
          and variables.bull_reentry_allowed
        set: BULL
        confirm: 3
      - when: state.trend_mode == 'RECOVERY' and variables.risk_off_score >= 5
        set: CAUTION
        confirm: 3

  # 목표 비중을 즉시 바꾸는 구조적 약세 신호의 시작과 종료를 기록한다.
  structural_bear_mode:
    initial: 'FALSE'
    rules:
      - when: >
          state.structural_bear_mode == 'FALSE'
          and variables.structural_bear
        set: 'TRUE'
      - when: >
          state.structural_bear_mode == 'TRUE'
          and not variables.structural_bear
        set: 'FALSE'

target:
  # 확정 BEAR는 모든 밸류에이션 판단보다 우선해 QQQ를 전부 비운다.
  - when: state.trend_mode == 'BEAR'
    weights:
      QQQ: 0%
      BIL: 100%

  # 밸류에이션 급락과 가격 약세가 함께 확인되면 QQQ를 30%까지 줄인다.
  - when: state.defense_mode == 'DEFENSE'
    weights:
      QQQ: 30%
      BIL: 70%

  # 확정 BEAR를 기다리는 구조적 약세 구간에서는 QQQ를 절반으로 줄인다.
  - when: state.structural_bear_mode == 'TRUE'
    weights:
      QQQ: 50%
      BIL: 50%

  # 추세 회복 초기에는 QQQ를 80%까지만 허용한다.
  - when: state.trend_mode == 'RECOVERY'
    weights:
      QQQ: 80%
      BIL: 20%

  # 그 밖의 정상·주의·밸류에이션 WARNING 구간은 QQQ를 100% 보유한다.
  - weights:
      QQQ: 100%
      BIL: 0%

# 알림 전용 규칙이다. 목표 비중과 매매 판단에는 영향을 주지 않는다.
notifications:
  weekly: true
  states:
    structural_bear_mode:
      label: 구조적 약세
      alerts:
        - on: changed
          from: 'FALSE'
          to: 'TRUE'
    trend_mode:
      label: 추세
      alerts:
        - on: confirmation_started
          to: [BEAR, RECOVERY, BULL]
        - on: changed
          to: BEAR
          message: 장기 하락 추세가 확인됨
        - on: changed
          from: BEAR
          to: RECOVERY
          message: 반등 조건이 확인됨
    defense_mode:
      label: 밸류에이션
      alerts:
        - on: confirmation_started
          to: [DEFENSE, NORMAL]
        - on: changed
          from: NORMAL
          to: WARNING
          message: 밸류에이션 급락을 감지해 가격 약세를 추가 확인 중
        - on: changed
          to: DEFENSE
          message: 밸류에이션 급락과 가격 약세가 확인되어 방어 진입
        - on: changed
          from: WARNING
          to: NORMAL
          message: 밸류에이션 점수가 회복되어 경고 해제
        - on: changed
          from: DEFENSE
          to: NORMAL
          message: 가격 회복 조건이 확인되어 방어 종료
  variables:
    risk_off_score: {label: 약세, max: 6}
    recovery_score: {label: 회복, max: 6}
  market:
    - {ticker: QQQ, field: roc1, label: 1일, format: percent}
    - {ticker: QQQ, field: roc5, label: 5일, format: percent}
    - {ticker: QQQ, field: roc20, label: 20일, format: percent}
    - {ticker: QQQ, field: drawdown120, label: 120일 고점 대비, format: ratio_percent}
    - {ticker: QQQ, field: valuation_score, label: 밸류에이션, format: number}
  prealerts:
    - id: target-deviation
      when: >
        target_deviation() >= 5%
        and target_deviation() < 7.5%
      reset_when: target_deviation() < 4%
      message: 목표 비중 괴리가 실행 기준에 접근 (5.0%p 이상 / 실행 7.5%p)

rebalance:
  # 목표 비중과 실제 비중의 최대 차이가 7.5%p 이상일 때만 주문한다.
  - check: daily
    when: target_deviation() >= 7.5%

execution:
  days: 1
