strategy:
  id: qqq-valuation-credit-guard-no-topup
  name: QQQ Valuation Credit Guard No Top-up (30) [BIL]
  version: 1
  dsl_version: 1
  enabled: true

# 연구용 혼합안 REL10_CAP20_INDEPENDENT의 신용·상대약세 방어와
# 심화 방어 중 QQQ 재매수 제한을 28번 위에 적용한다.
# 신용지표 BAA10Y는 데이터 공급 계층에서 관측일보다 한 거래일 늦게 제공해야 한다.
# 닷컴 대체검증 4.942%/-15.859%는 연구용 Python 래퍼 결과로,
# 이 YAML의 교차 엔진 동등성 확인 전에는 운영 성과로 표시하지 않는다.
#
# 25번의 밸류에이션·추세 방어를 유지하면서 27번의 하락 매수 구조를 조건부로 결합한다.
# 평상시에는 QQQ 100%를 유지하고, 밸류에이션 WARNING에서만 BIL 30%를 확보한다.
# 이후 주기 고점 대비 -10% 하락하면 BIL 완충 자금을 전부 투입해 QQQ 100%로 복귀한다.
# -20%/-32.5% 단계는 추가 하락 알림과 회복 경로 추적용이며 목표 비중은 계속 QQQ 100%다.
# DEFENSE·구조적 약세·BEAR 목표는 하락 매수보다 항상 우선한다.
assets:
  required: [QQQ, BIL]
  observations: [SPY, BAA10Y]
  risk: [QQQ]

parameters:
  # 하락 단계 진입선: 추적 고점 대비 -10%/-20%/-32.5%
  drop_b: -0.10
  drop_c: -0.20
  drop_d: -0.325
  # 회복 단계 전환선에는 서로 다른 진입·이탈 기준을 둬 잦은 상태 왕복을 막는다.
  recovery_stage_1: 0.075
  recovery_stage_2: -0.085
  recovery_stage_3: -0.175
  valuation_arm_score: 65
  valuation_breakdown_points: 25

variables:
  # 단기·중기 가격과 추세 조건 6개 중 약세로 기운 조건 수다.
  risk_off_score: >
    count(
      QQQ.close < QQQ.ema20,
      QQQ.close < QQQ.ema55,
      QQQ.ema20 < QQQ.ema55,
      QQQ.roc5 < 0,
      QQQ.roc20 < 0,
      QQQ.ema20_slope5 < 0
    )
  # risk_off_score와 반대 방향의 회복 조건 수다.
  recovery_score: >
    count(
      QQQ.close > QQQ.ema20,
      QQQ.close > QQQ.ema55,
      QQQ.ema20 > QQQ.ema55,
      QQQ.roc5 > 0,
      QQQ.roc20 > 0,
      QQQ.ema20_slope5 > 0
    )
  # 장기 이동평균까지 무너진 구조적 약세는 단순 가격 조정보다 우선한다.
  structural_bear: >
    variables.risk_off_score >= 5
    and QQQ.close < QQQ.ema20
    and QQQ.ema20 < QQQ.ema55
    and QQQ.ema55 < QQQ.ema200
    and QQQ.roc60 < 0
    and QQQ.ema200_slope20 < 0
  bull_reentry_allowed: >
    QQQ.close > QQQ.ema55
    and QQQ.roc60 > 0

  # QQQ/SPY 상대수익률과 하루 늦게 관측한 Baa-국채 신용스프레드
  relative_roc20: >
    (1 + QQQ.roc20 / 100) / (1 + SPY.roc20 / 100) * 100 - 100
  relative_roc60: >
    (1 + QQQ.roc60 / 100) / (1 + SPY.roc60 / 100) * 100 - 100
  credit_change20: >
    BAA10Y.close - BAA10Y.close / (1 + BAA10Y.roc20 / 100)

state:
  # -5% 상대약세가 최근 20거래일 안에 있었는지 기억한다.
  relative_weak_age:
    initial: 20
    rules:
      - when: variables.relative_roc20 <= -5
        set: 0
      - when: state.relative_weak_age < 20
        set: "=state.relative_weak_age + 1"

  # 신용 악화가 확인되면 QQQ 비중 상한 65%.
  credit_guard:
    initial: 'FALSE'
    rules:
      - when: >
          state.credit_guard == 'FALSE'
          and state.relative_weak_age < 20
          and BAA10Y.close >= 2
          and variables.credit_change20 >= 0.30
        set: 'TRUE'
      - when: >
          state.credit_guard == 'TRUE'
          and QQQ.close > QQQ.ema200
          and QQQ.ema55 > QQQ.ema200
          and variables.relative_roc60 > 0
          and SPY.close > SPY.ema200
        set: 'FALSE'
        confirm: 10

  # 첫 경보 중 20일 상대약세가 -10% 이하면 20% 상한.
  deep_guard:
    initial: 'FALSE'
    rules:
      - when: >
          state.deep_guard == 'FALSE'
          and state.credit_guard == 'TRUE'
          and variables.relative_roc20 <= -10
        set: 'TRUE'
      - when: >
          state.deep_guard == 'TRUE'
          and QQQ.close > QQQ.ema200
          and QQQ.ema55 > QQQ.ema200
          and variables.relative_roc60 > 0
          and SPY.close > SPY.ema200
          and (BAA10Y.close < 2 or state.deep_credit_peak - BAA10Y.close >= 0.50)
        set: 'FALSE'
        confirm: 10

  deep_credit_peak:
    initial: 0
    rules:
      - when: changed(state.deep_guard) and state.deep_guard == 'TRUE'
        set: "=BAA10Y.close"
      - when: state.deep_guard == 'TRUE' and BAA10Y.close > state.deep_credit_peak
        set: "=BAA10Y.close"

  stage:
    initial: 0
    rules:
      # 3단계에서 이전 고점 대비 -17.5%까지 회복하면 2단계로 낮춘다.
      - when: >
          state.stage == 3
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.recovery_stage_3)
        set: 2
      # 2단계에서 -32.5%까지 추가 하락하면 3단계로 올린다.
      - when: >
          state.stage == 2
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_d)
        set: 3
      # 2단계에서 -8.5%까지 회복하면 1단계로 낮춘다.
      - when: >
          state.stage == 2
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.recovery_stage_2)
        set: 1
      # 1단계에서 -20%까지 추가 하락하면 2단계로 올린다.
      - when: >
          state.stage == 1
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_c)
        set: 2
      # 이전 고점을 7.5% 돌파해야 하락 매수 사이클을 완전히 종료한다.
      - when: >
          state.stage == 1
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.recovery_stage_1)
        set: 0
      # 추적 고점 대비 -10%가 되면 첫 하락 매수 단계에 진입한다.
      - when: >
          state.stage == 0
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_b)
        set: 1

  peak_price:
    initial: 0
    rules:
      # 0단계에서만 신고가를 따라가며, 사이클 종료 시 기준 고점을 새로 잡는다.
      - when: state.peak_price == 0
        set: "=QQQ.close"
      - when: changed(state.stage) and state.stage == 0
        set: "=QQQ.close"
      - when: state.stage == 0 and QQQ.close > state.peak_price
        set: "=QQQ.close"

  defense_mode:
    initial: NORMAL
    rules:
      # 밸류에이션 붕괴와 6개 약세 조건이 동시에 충족되면 즉시 DEFENSE로 간다.
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
          and variables.risk_off_score >= 6
        set: DEFENSE
      # 고평가 이후 밸류에이션 점수가 25점 이상 꺾이면 먼저 WARNING을 건다.
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
        set: WARNING
      # 밸류에이션이 기존 고점까지 회복하면 WARNING을 해제한다.
      - when: >
          state.defense_mode == 'WARNING'
          and QQQ.valuation_score >= state.valuation_peak
        set: NORMAL
      # WARNING에서 약세 조건 4개 이상이 6거래일 지속되면 DEFENSE로 강화한다.
      - when: >
          state.defense_mode == 'WARNING'
          and variables.risk_off_score >= 4
        set: DEFENSE
        confirm: 6
      # DEFENSE 해제는 회복 조건과 EMA20 회복이 2거래일 확인돼야 한다.
      - when: >
          state.defense_mode == 'DEFENSE'
          and variables.recovery_score >= 4
          and QQQ.close > QQQ.ema20
        set: NORMAL
        confirm: 2

  valuation_peak:
    initial: 0
    rules:
      - when: state.valuation_peak == 0
        set: "=QQQ.valuation_score"
      - when: changed(state.defense_mode) and state.defense_mode == 'NORMAL'
        set: "=QQQ.valuation_score"
      - when: >
          state.defense_mode == 'NORMAL'
          and QQQ.valuation_score > state.valuation_peak
        set: "=QQQ.valuation_score"

  trend_mode:
    initial: UNINITIALIZED
    rules:
      - when: state.trend_mode == 'UNINITIALIZED' and variables.structural_bear
        set: BEAR
      - when: state.trend_mode == 'UNINITIALIZED' and variables.risk_off_score >= 5
        set: CAUTION
      - when: state.trend_mode == 'UNINITIALIZED'
        set: BULL
      - when: state.trend_mode == 'BULL' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'BULL'
          and QQQ.close < QQQ.ema20
          and variables.risk_off_score >= 3
          and SPY.close < SPY.ema20
          and SPY.roc5 <= -1
        set: CAUTION
        confirm: 1
      - when: state.trend_mode == 'CAUTION' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: state.trend_mode == 'CAUTION' and variables.recovery_score >= 4
        set: BULL
        confirm: 3
      - when: state.trend_mode == 'BEAR' and variables.recovery_score >= 3
        set: RECOVERY
        confirm: 3
      - when: state.trend_mode == 'RECOVERY' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'RECOVERY'
          and variables.recovery_score >= 4
          and variables.bull_reentry_allowed
        set: BULL
        confirm: 3
      - when: state.trend_mode == 'RECOVERY' and variables.risk_off_score >= 5
        set: CAUTION
        confirm: 3

  structural_bear_mode:
    initial: 'FALSE'
    rules:
      - when: >
          state.structural_bear_mode == 'FALSE'
          and variables.structural_bear
        set: 'TRUE'
      - when: >
          state.structural_bear_mode == 'TRUE'
          and not variables.structural_bear
        set: 'FALSE'

target:
  # 아래 규칙은 위에서부터 먼저 맞는 하나를 적용한다.
  # 따라서 BEAR·DEFENSE·구조적 약세·RECOVERY가 하락 매수보다 우선한다.
  - when: state.trend_mode == 'BEAR'
    weights: {QQQ: 0%, BIL: 100%}
  # 심화 방어 진입일은 즉시 20%로 축소한다. 이후 가격 하락으로
  # 실제 QQQ 비중이 20% 아래로 내려가면 목표를 현재 비중으로 낮춰
  # QQQ를 다시 사지 않는다. 해제 뒤에는 기존 목표로 복귀한다.
  - when: state.deep_guard == 'TRUE' and previous(state.deep_guard) == 'TRUE'
    weights:
      QQQ: "min(20%, portfolio.weight.QQQ)"
      BIL: "1 - min(20%, portfolio.weight.QQQ)"
  - when: state.deep_guard == 'TRUE'
    weights: {QQQ: 20%, BIL: 80%}
  - when: state.defense_mode == 'DEFENSE'
    weights: {QQQ: 30%, BIL: 70%}
  - when: state.structural_bear_mode == 'TRUE'
    weights: {QQQ: 50%, BIL: 50%}
  # 기존 28번 목표가 더 낮으면 기존 방어를 우선한다.
  - when: state.credit_guard == 'TRUE'
    weights: {QQQ: 65%, BIL: 35%}
  - when: state.trend_mode == 'RECOVERY'
    weights: {QQQ: 80%, BIL: 20%}
  # -10%에 진입한 뒤에는 추가 하락 단계가 바뀌어도 QQQ 100%를 유지한다.
  - when: state.stage == 3
    weights: {QQQ: 100%, BIL: 0%}
  - when: state.stage == 2
    weights: {QQQ: 100%, BIL: 0%}
  - when: state.stage == 1
    weights: {QQQ: 100%, BIL: 0%}
  # 하락 매수 단계가 아니면 WARNING에서만 BIL 30%를 확보한다.
  - when: state.defense_mode == 'WARNING'
    weights: {QQQ: 70%, BIL: 30%}
  - weights: {QQQ: 100%, BIL: 0%}

notifications:
  schedule: weekly
  states:
    credit_guard:
      label: 상대약세·신용 경보
      values: {'FALSE': 정상, 'TRUE': 1차 방어}
      alerts:
        - on: changed
          to: 'TRUE'
        - on: changed
          to: 'FALSE'
          kind: resolved
    deep_guard:
      label: 심화 방어
      values: {'FALSE': 정상, 'TRUE': 재매수 제한}
      alerts:
        - on: changed
          to: 'TRUE'
        - on: changed
          to: 'FALSE'
          kind: resolved
    stage:
      label: 하락 매수 단계
      values: {0: 대기, 1: 1단계, 2: 2단계, 3: 3단계}
      alerts:
        - on: changed
          to: [1, 2, 3]
          kind: update
        - on: changed
          to: 0
          kind: resolved
          message: 하락 매수 단계 종료
    structural_bear_mode:
      label: 구조적 약세
      values: {'FALSE': 정상, 'TRUE': 감지}
      alerts:
        - on: changed
          from: 'FALSE'
          to: 'TRUE'
        - on: changed
          to: 'FALSE'
          kind: resolved
          message: 구조적 약세 해제
    trend_mode:
      label: 추세
      values: {UNINITIALIZED: 초기화 중, BULL: 상승, CAUTION: 주의, BEAR: 하락, RECOVERY: 회복}
      alerts:
        - on: confirmation_started
          to: [BEAR, RECOVERY, BULL]
        - on: changed
          to: BEAR
        - on: changed
          from: BEAR
          to: RECOVERY
        - on: changed
          to: BULL
          kind: resolved
          message: 상승 추세 확인 완료
    defense_mode:
      label: 밸류에이션
      values: {NORMAL: 정상, WARNING: 경고, DEFENSE: 방어}
      alerts:
        - on: confirmation_started
          to: [DEFENSE, NORMAL]
        - on: changed
          from: NORMAL
          to: WARNING
        - on: changed
          to: DEFENSE
        - on: changed
          from: WARNING
          to: NORMAL
          kind: resolved
        - on: changed
          from: DEFENSE
          to: NORMAL
          kind: resolved
  variables:
    risk_off_score: {label: 약세, max: 6, display: bar}
    recovery_score: {label: 회복, max: 6, display: bar}
  market:
    - {ticker: QQQ, field: roc1, label: 1일, format: percent}
    - {ticker: QQQ, field: roc5, label: 5일, format: percent}
    - {ticker: QQQ, field: roc20, label: 20일, format: percent}
    - {ticker: QQQ, field: drawdown120, label: 120일 고점 대비, format: ratio_percent}
    - {ticker: QQQ, field: valuation_score, label: 밸류에이션, format: number}
  prealerts:
    - id: qqq-underweight
      when: weight_deviation('QQQ') <= -3%
      reset_when: weight_deviation('QQQ') > -2%
      message: QQQ 비중이 목표보다 3.0%p 이상 낮음 (매수 기준 -4.0%p)
      reset_message: QQQ 비중 부족 주의 해제
    - id: target-deviation
      when: target_deviation() >= 5% and target_deviation() < 7.5%
      reset_when: target_deviation() < 4%
      message: 목표 비중 괴리가 실행 기준에 접근 (5.0%p 이상 / 실행 7.5%p)
      reset_message: 목표 비중 괴리 주의 해제

rebalance:
  - check: daily
    when: >
      changed(state.credit_guard)
      or changed(state.deep_guard)
      or target_deviation() >= 7.5%
      or weight_deviation('QQQ') <= -4%

execution:
  days: 1
