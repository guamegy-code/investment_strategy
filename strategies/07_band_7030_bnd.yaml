strategy:
  id: band-7030
  name: 70/30 Band
  version: 1
  dsl_version: 1
  # 이 독립 전략을 일반 실행 목록에 포함하려면 true로 설정한다.
  enabled: true

assets:
  required: [QQQ, BND]
  risk: [QQQ]

target:
  - weights:
      QQQ: 70%
      BND: 30%

rebalance:
  - check: daily
    when: target_deviation() >= 5%

execution:
  days: 1
