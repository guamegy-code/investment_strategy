strategy:
  id: qqq-cash-dip-buyer
  name: QQQ Cash Peak-Grid 70-30 (a-b-c-d)
  version: 7
  dsl_version: 1
  enabled: true

# ==============================================================================
# 1. 자산 설정 (Assets)
# ------------------------------------------------------------------------------
# - riskAsset: 기본 QQQ (추후 원하는 위험자산 티커로 변경 가능)
# - safeAsset: 기본 BIL (현금 대용 단기채, 추후 TDF2050_PROXY 등으로 변경 가능)
# ==============================================================================
assets:
  required: [QQQ, BIL]
  risk: [QQQ]

# ==============================================================================
# 2. 파라미터 (Parameters)
# ------------------------------------------------------------------------------
# [최고점 a 기준 하락 지점]
# - b 지점: 최고점 a 대비 -10% 하락 (남은 현금의 30% 투입 -> b1 매수)
# - c 지점: 최고점 a 대비 -20% 하락 (남은 현금의 50% 투입 -> c1 매수)
# - d 지점: 최고점 a 대비 -30% 하락 (남은 현금의 50% 투입 -> d1 매수)
#
# [상승 회복 시 매도 및 현금화]
# - c 지점 회복 시: d1 매도하여 현금화 (stage 3 -> stage 2)
# - b 지점 회복 시: c1 매도하여 현금화 (stage 2 -> stage 1)
# - a 지점 회복 시: b1 매도하여 현금화 (stage 1 -> stage 0, 물탄 물량 0개 & 현금 증가)
# - 최고점 a 갱신 시: 새로운 a가 되고 b, c, d 기준 가격도 자동 상향 갱신
# ==============================================================================
parameters:
  drop_b: -0.10                  # b 지점: a 대비 -10%
  drop_c: -0.20                  # c 지점: a 대비 -20%
  drop_d: -0.30                  # d 지점: a 대비 -30%

# ==============================================================================
# 3. 상태 관리 (State)
# ------------------------------------------------------------------------------
# - stage:
#     0 = a 지점 위 기본 상태 (물탄 것 없음, 상승 시 100% 홀딩)
#     1 = b 지점 도달 (b1 매수 상태)
#     2 = c 지점 도달 (c1 매수 상태)
#     3 = d 지점 도달 (d1 매수 상태)
# - peak_price: 최고점 a 지점 가격 추적
# ==============================================================================
state:
  stage:
    initial: 0
    rules:
      # [3단계 -> 2단계] c 지점(a 대비 -20%) 회복 시 -> d1 매도
      - when: >
          state.stage == 3
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.drop_c)
        set: 2

      # [2단계 -> 3단계] d 지점(a 대비 -30%) 도달 시 -> d1 매수 (남은 현금의 50%)
      - when: >
          state.stage == 2
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_d)
        set: 3

      # [2단계 -> 1단계] b 지점(a 대비 -10%) 회복 시 -> c1 매도
      - when: >
          state.stage == 2
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.drop_b)
        set: 1

      # [1단계 -> 2단계] c 지점(a 대비 -20%) 도달 시 -> c1 매수 (남은 현금의 50%)
      - when: >
          state.stage == 1
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_c)
        set: 2

      # [1단계 -> 0단계] a 지점(최고점) 회복 시 -> b1 매도하여 기본 복귀 (현금 원금+수익 회수)
      - when: >
          state.stage == 1
          and state.peak_price > 0
          and QQQ.close >= state.peak_price
        set: 0

      # [0단계 -> 1단계] b 지점(a 대비 -10%) 도달 시 -> b1 매수 (남은 현금의 30%)
      - when: >
          state.stage == 0
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_b)
        set: 1

  peak_price:
    initial: 0
    rules:
      # 최초 실행 시 현재 종가로 초기화
      - when: state.peak_price == 0
        set: "=QQQ.close"

      # 0단계로 복귀한 날(changed)에 현재 종가를 새로운 최고점 a로 재설정
      - when: changed(state.stage) and state.stage == 0
        set: "=QQQ.close"

      # 0단계 평상시 신고가 갱신 추적 (상승 시 계속 보유하며 a 지점 갱신)
      - when: state.stage == 0 and QQQ.close > state.peak_price
        set: "=QQQ.close"

# ==============================================================================
# 4. 목표 비중 (Target)
# ------------------------------------------------------------------------------
# - stage 3 (d지점 매수 후): QQQ 94.75%, 현금 5.25% (남은 현금 10.5%의 50% 투입)
# - stage 2 (c지점 매수 후): QQQ 89.50%, 현금 10.50% (남은 현금 21.0%의 50% 투입)
# - stage 1 (b지점 매수 후): QQQ 79.00%, 현금 21.00% (현금 30.0%의 30% 투입)
# - stage 0 (a지점 기본 상태): QQQ 70.00%, 현금 30.00%
# ==============================================================================
target:
  - when: state.stage == 3
    weights:
      QQQ: 100% #94.75%
      BIL: 0% #5.25%

  - when: state.stage == 2
    weights:
      QQQ: 89.5%
      BIL: 10.5%

  - when: state.stage == 1
    weights:
      QQQ: 79%
      BIL: 21%

  - weights:
      QQQ: 70%
      BIL: 30%

# ==============================================================================
# 5. 리밸런싱 (Rebalance)
# ------------------------------------------------------------------------------
# - 단계(stage)가 바뀔 때만(b, c, d 매수 또는 회복 매도 시점) 즉시 1일 실행
# - 0단계 상승 구간에서는 주기적 리밸런싱 없이 QQQ를 100% 그대로 보유!
# ==============================================================================
rebalance:
  - when: changed(state.stage)
    days: 1

execution:
  days: 1