strategy:
  id: band-7030-tdf-valuation-defense
  name: 70/30 TDF Valuation Defense (26) [BIL]
  version: 2
  dsl_version: 1
  enabled: true

# 26번은 퇴직연금용 15번의 QQQ 70%·TDF2050 30% 구조에
# 25번의 밸류에이션 급락 방어를 결합한 전략이다.
#
# 상태 구성
# - trend_mode는 15번의 market_mode와 같은 네 상태 추세 규칙이다.
# - 같은 규칙을 두 번 계산하지 않도록 market_mode를 별도로 두지 않는다.
# - defense_mode는 월간 밸류에이션 급락과 일별 가격 약세를 함께 확인한다.
# - valuation_peak는 한 방어 주기 안에서 관측한 밸류에이션 점수의 고점이다.
#
# 방어 우선순위
# - 구조적 약세 사전 경보는 QQQ를 모두 비우고 BIL 100%로 이동한다.
# - 확정 BEAR에서는 QQQ 0%, TDF2050 20%, BIL 80%를 목표로 한다.
# - 위 두 조건이 아닐 때 밸류에이션 DEFENSE가 되면 QQQ 30%, BIL 70%로 줄인다.
# - 여러 조건이 겹치면 QQQ 비중이 더 낮은 목표가 항상 우선한다.
#
# 신호는 당일 종가로 판정하고 주문은 다음 거래일 시가부터 1일에 걸쳐 실행한다.
assets:
  required: [QQQ, TDF2050_PROXY, BIL]
  observations: [SPY]
  risk: [QQQ]

parameters:
  # 22번 합성점수의 고평가 진입선과 주기 고점 대비 붕괴 폭이다.
  valuation_arm_score: 65
  valuation_breakdown_points: 25

variables:
  # 여섯 가지 일별 가격 약세 조건 중 충족 개수를 센다.
  risk_off_score: >
    count(
      QQQ.close < QQQ.ema20,
      QQQ.close < QQQ.ema55,
      QQQ.ema20 < QQQ.ema55,
      QQQ.roc5 < 0,
      QQQ.roc20 < 0,
      QQQ.ema20_slope5 < 0
    )

  # risk_off_score와 반대 방향인 여섯 회복 조건의 충족 개수를 센다.
  recovery_score: >
    count(
      QQQ.close > QQQ.ema20,
      QQQ.close > QQQ.ema55,
      QQQ.ema20 > QQQ.ema55,
      QQQ.roc5 > 0,
      QQQ.roc20 > 0,
      QQQ.ema20_slope5 > 0
    )

  # 장기 하락 추세가 정렬된 경우에만 확정 BEAR 후보로 본다.
  structural_bear: >
    variables.risk_off_score >= 5
    and QQQ.close < QQQ.ema20
    and QQQ.ema20 < QQQ.ema55
    and QQQ.ema55 < QQQ.ema200
    and QQQ.roc60 < 0
    and QQQ.ema200_slope20 < 0

  # RECOVERY에서 BULL로 복귀할 때 중기 추세 회복까지 확인한다.
  bull_reentry_allowed: >
    QQQ.close > QQQ.ema55
    and QQQ.roc60 > 0

state:
  # 25번의 밸류에이션 주도 방어 상태다.
  defense_mode:
    initial: NORMAL
    rules:
      # 월간 밸류에이션 급락과 여섯 약세 조건이 겹치면 즉시 방어한다.
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
          and variables.risk_off_score >= 6
        set: DEFENSE

      # 극단 약세가 아니면 WARNING으로 전환해 일별 가격 약세를 더 확인한다.
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
        set: WARNING

      # WARNING 중 점수가 기존 고점을 회복하면 오경보로 보고 정상화한다.
      - when: >
          state.defense_mode == 'WARNING'
          and QQQ.valuation_score >= state.valuation_peak
        set: NORMAL

      # 일반 WARNING에서는 가격 약세가 6거래일 이어져야 방어한다.
      - when: >
          state.defense_mode == 'WARNING'
          and variables.risk_off_score >= 4
        set: DEFENSE
        confirm: 6

      # 가격 회복이 2거래일 이어지면 정상 비중으로 복귀한다.
      - when: >
          state.defense_mode == 'DEFENSE'
          and variables.recovery_score >= 4
          and QQQ.close > QQQ.ema20
        set: NORMAL
        confirm: 2

  # 한 방어 주기에서 관측한 합성 밸류에이션 점수의 고점이다.
  valuation_peak:
    initial: 0
    rules:
      # 최초 유효 점수를 기준 고점으로 저장한다.
      - when: state.valuation_peak == 0
        set: "=QQQ.valuation_score"

      # 방어 또는 경고 종료일 점수로 다음 주기의 고점을 다시 시작한다.
      - when: changed(state.defense_mode) and state.defense_mode == 'NORMAL'
        set: "=QQQ.valuation_score"

      # 정상 상태에서만 고점을 올리고 WARNING·DEFENSE 중에는 고정한다.
      - when: >
          state.defense_mode == 'NORMAL'
          and QQQ.valuation_score > state.valuation_peak
        set: "=QQQ.valuation_score"

  # 15번의 네 가지 시장 상태를 trend_mode라는 이름으로 한 번만 계산한다.
  trend_mode:
    initial: UNINITIALIZED
    rules:
      - when: state.trend_mode == 'UNINITIALIZED' and variables.structural_bear
        set: BEAR
      - when: state.trend_mode == 'UNINITIALIZED' and variables.risk_off_score >= 5
        set: CAUTION
      - when: state.trend_mode == 'UNINITIALIZED'
        set: BULL

      - when: state.trend_mode == 'BULL' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'BULL'
          and QQQ.close < QQQ.ema20
          and variables.risk_off_score >= 3
          and SPY.close < SPY.ema20
          and SPY.roc5 <= -1
        set: CAUTION
        confirm: 1

      - when: state.trend_mode == 'CAUTION' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: state.trend_mode == 'CAUTION' and variables.recovery_score >= 4
        set: BULL
        confirm: 3

      - when: state.trend_mode == 'BEAR' and variables.recovery_score >= 3
        set: RECOVERY
        confirm: 3

      - when: state.trend_mode == 'RECOVERY' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'RECOVERY'
          and variables.recovery_score >= 4
          and variables.bull_reentry_allowed
        set: BULL
        confirm: 3
      - when: state.trend_mode == 'RECOVERY' and variables.risk_off_score >= 5
        set: CAUTION
        confirm: 3

  # 목표 비중을 즉시 바꾸는 구조적 약세 신호의 시작과 종료를 기록한다.
  structural_bear_mode:
    initial: 'FALSE'
    rules:
      - when: >
          state.structural_bear_mode == 'FALSE'
          and variables.structural_bear
        set: 'TRUE'
      - when: >
          state.structural_bear_mode == 'TRUE'
          and not variables.structural_bear
        set: 'FALSE'

target:
  # 확정 BEAR에서는 15번처럼 TDF2050 20%를 다시 편입한다.
  - when: state.trend_mode == 'BEAR'
    weights:
      QQQ: 0%
      TDF2050_PROXY: 20%
      BIL: 80%

  # 10일 BEAR 확인 전의 구조적 약세에는 가장 강한 BIL 100% 방어를 적용한다.
  - when: >
      state.trend_mode != 'BEAR'
      and state.structural_bear_mode == 'TRUE'
    weights:
      QQQ: 0%
      TDF2050_PROXY: 0%
      BIL: 100%

  # 구조적 약세가 아닐 때 밸류에이션 붕괴와 가격 약세가 겹치면 QQQ를 30%로 줄인다.
  - when: state.defense_mode == 'DEFENSE'
    weights:
      QQQ: 30%
      TDF2050_PROXY: 0%
      BIL: 70%

  # 추세 회복 초기에는 15번과 같은 QQQ 60%·TDF2050 30%를 사용한다.
  - when: state.trend_mode == 'RECOVERY'
    weights:
      QQQ: 60%
      TDF2050_PROXY: 30%
      BIL: 10%

  # 그 밖의 BULL·CAUTION·밸류에이션 WARNING은 퇴직연금 70/30 비중을 유지한다.
  - weights:
      QQQ: 70%
      TDF2050_PROXY: 30%
      BIL: 0%

# 알림 전용 규칙이다. 목표 비중과 매매 판단에는 영향을 주지 않는다.
notifications:
  schedule: weekly
  states:
    structural_bear_mode:
      label: 구조적 약세
      values: {'FALSE': 정상, 'TRUE': 감지}
      alerts:
        - on: changed
          from: 'FALSE'
          to: 'TRUE'
    trend_mode:
      label: 추세
      values: {BULL: 상승, CAUTION: 주의, BEAR: 하락, RECOVERY: 회복}
      alerts:
        - on: confirmation_started
          to: [BEAR, RECOVERY, BULL]
        - on: changed
          to: BEAR
          message: 장기 하락 추세가 확인됨
        - on: changed
          from: BEAR
          to: RECOVERY
          message: 반등 조건이 확인됨
    defense_mode:
      label: 밸류에이션
      values: {NORMAL: 정상, WARNING: 경고, DEFENSE: 방어}
      alerts:
        - on: confirmation_started
          to: [DEFENSE, NORMAL]
        - on: changed
          from: NORMAL
          to: WARNING
          message: 밸류에이션 급락을 감지해 가격 약세를 추가 확인 중
        - on: changed
          to: DEFENSE
          message: 밸류에이션 급락과 가격 약세가 확인되어 방어 진입
        - on: changed
          from: WARNING
          to: NORMAL
          message: 밸류에이션 점수가 회복되어 경고 해제
        - on: changed
          from: DEFENSE
          to: NORMAL
          message: 가격 회복 조건이 확인되어 방어 종료
  variables:
    risk_off_score: {label: 약세, max: 6, display: bar}
    recovery_score: {label: 회복, max: 6, display: bar}
  market:
    - {ticker: QQQ, field: roc1, label: 1일, format: percent}
    - {ticker: QQQ, field: roc5, label: 5일, format: percent}
    - {ticker: QQQ, field: roc20, label: 20일, format: percent}
    - {ticker: QQQ, field: drawdown120, label: 120일 고점 대비, format: ratio_percent}
    - {ticker: QQQ, field: valuation_score, label: 밸류에이션, format: number}
  prealerts:
    - id: qqq-underweight
      when: weight_deviation('QQQ') <= -3%
      reset_when: weight_deviation('QQQ') > -2%
      message: QQQ 비중이 목표보다 3.0%p 이상 낮음 (매수 기준 -4.0%p)
    - id: target-deviation
      when: >
        target_deviation() >= 5%
        and target_deviation() < 7.5%
      reset_when: target_deviation() < 4%
      message: 목표 비중 괴리가 실행 기준에 접근 (5.0%p 이상 / 실행 7.5%p)

rebalance:
  # 기존 최대 절대 괴리 7.5%p는 유지하고, QQQ 과소비중은 -4%p에서 먼저 채운다.
  - check: daily
    when: >
      target_deviation() >= 7.5%
      or weight_deviation('QQQ') <= -4%

execution:
  # 종가 신호 다음 거래일 시가에 한 번에 목표 비중으로 이동한다.
  days: 1
