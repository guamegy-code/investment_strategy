strategy:
  id: qqq-valuation-breakdown-defense
  name: QQQ Valuation Breakdown Defense (24) [BIL]
  version: 1
  dsl_version: 1
  enabled: false

# 24번은 22번의 합성 밸류에이션 점수를 주 방어 신호로 사용하고,
# 23번의 추세 상태를 안전 상한으로 결합한 개인연금용 QQQ/BIL 전략이다.
#
# 밸류에이션 방어 주기
# - NORMAL에서 합성점수가 65 이상인 고점을 만든 뒤 25점 이상 하락하면 WARNING으로 전환한다.
# - WARNING에서 risk_off_score가 4 이상인 날이 6거래일 이어지면 DEFENSE로 전환한다.
# - DEFENSE에서는 QQQ 50%, BIL 50%를 목표로 한다.
# - recovery_score가 4 이상이고 QQQ가 EMA20 위인 날이 3거래일 이어지면 NORMAL로 복귀한다.
# - NORMAL로 복귀한 날의 점수로 밸류에이션 고점을 초기화하여 새로운 방어 주기를 시작한다.
#
# 추세 안전 상한
# - 23번의 BEAR 확정은 QQQ 0%, 구조적 약세 사전 경보는 QQQ 50%, RECOVERY는 QQQ 80%다.
# - 밸류에이션 목표와 추세 목표가 겹치면 QQQ 비중이 더 낮은 쪽을 우선한다.
# - 신호는 당일 종가로 판정하고 주문은 다음 거래일 시가부터 1일에 걸쳐 실행한다.
assets:
  required: [QQQ, BIL]
  observations: [SPY]
  risk: [QQQ]

parameters:
  # 22번 합성점수의 고평가 진입선과 한 방어 주기 내 고점 대비 붕괴 폭이다.
  valuation_arm_score: 65
  valuation_breakdown_points: 25

variables:
  # 아래 여섯 약세 조건 중 충족 개수를 센다.
  risk_off_score: >
    count(
      QQQ.close < QQQ.ema20,
      QQQ.close < QQQ.ema55,
      QQQ.ema20 < QQQ.ema55,
      QQQ.roc5 < 0,
      QQQ.roc20 < 0,
      QQQ.ema20_slope5 < 0
    )

  # risk_off_score와 반대 방향인 여섯 회복 조건의 충족 개수를 센다.
  recovery_score: >
    count(
      QQQ.close > QQQ.ema20,
      QQQ.close > QQQ.ema55,
      QQQ.ema20 > QQQ.ema55,
      QQQ.roc5 > 0,
      QQQ.roc20 > 0,
      QQQ.ema20_slope5 > 0
    )

  # 장기 하락 추세가 정렬된 경우에만 23번의 확정 BEAR 후보로 본다.
  structural_bear: >
    variables.risk_off_score >= 5
    and QQQ.close < QQQ.ema20
    and QQQ.ema20 < QQQ.ema55
    and QQQ.ema55 < QQQ.ema200
    and QQQ.roc60 < 0
    and QQQ.ema200_slope20 < 0

  bull_reentry_allowed: >
    QQQ.close > QQQ.ema55
    and QQQ.roc60 > 0

state:
  # 밸류에이션이 주도하는 대표 상태다.
  # WARNING 자체는 현금화하지 않고, 약세 확인이 끝난 DEFENSE에서만 QQQ를 줄인다.
  defense_mode:
    initial: NORMAL
    rules:
      - when: >
          state.defense_mode == 'NORMAL'
          and state.valuation_peak >= parameters.valuation_arm_score
          and QQQ.valuation_score <= state.valuation_peak - parameters.valuation_breakdown_points
        set: WARNING

      # WARNING 이후 점수가 기존 주기 고점을 회복하면 오경보로 보고 정상화한다.
      - when: >
          state.defense_mode == 'WARNING'
          and QQQ.valuation_score >= state.valuation_peak
        set: NORMAL

      # 값이 싸졌다는 사실만으로 매수하지 않고 실제 가격 약세가 6일 확인될 때 방어한다.
      - when: >
          state.defense_mode == 'WARNING'
          and variables.risk_off_score >= 4
        set: DEFENSE
        confirm: 6

      # 회복 강도와 EMA20 회복을 함께 확인한 뒤 위험자산 비중을 되돌린다.
      - when: >
          state.defense_mode == 'DEFENSE'
          and variables.recovery_score >= 4
          and QQQ.close > QQQ.ema20
        set: NORMAL
        confirm: 3

  # 한 방어 주기 안에서 관측된 합성 밸류에이션 점수의 고점이다.
  valuation_peak:
    initial: 0
    rules:
      # 최초 유효 점수를 기준 고점으로 저장한다.
      - when: state.valuation_peak == 0
        set: "=QQQ.valuation_score"

      # DEFENSE 종료나 WARNING 취소로 NORMAL에 복귀하면 새 주기를 시작한다.
      - when: changed(state.defense_mode) and state.defense_mode == 'NORMAL'
        set: "=QQQ.valuation_score"

      # NORMAL 상태에서만 고점을 올린다. WARNING·DEFENSE 중에는 기준을 고정한다.
      - when: >
          state.defense_mode == 'NORMAL'
          and QQQ.valuation_score > state.valuation_peak
        set: "=QQQ.valuation_score"

  # 23번의 네 가지 추세 상태를 별도 안전 상한으로 그대로 유지한다.
  trend_mode:
    initial: UNINITIALIZED
    rules:
      - when: state.trend_mode == 'UNINITIALIZED' and variables.structural_bear
        set: BEAR
      - when: state.trend_mode == 'UNINITIALIZED' and variables.risk_off_score >= 5
        set: CAUTION
      - when: state.trend_mode == 'UNINITIALIZED'
        set: BULL

      - when: state.trend_mode == 'BULL' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'BULL'
          and QQQ.close < QQQ.ema20
          and variables.risk_off_score >= 3
          and SPY.close < SPY.ema20
          and SPY.roc5 <= -1
        set: CAUTION
        confirm: 1

      - when: state.trend_mode == 'CAUTION' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: state.trend_mode == 'CAUTION' and variables.recovery_score >= 4
        set: BULL
        confirm: 3

      - when: state.trend_mode == 'BEAR' and variables.recovery_score >= 3
        set: RECOVERY
        confirm: 3

      - when: state.trend_mode == 'RECOVERY' and variables.structural_bear
        set: BEAR
        confirm: 10
      - when: >
          state.trend_mode == 'RECOVERY'
          and variables.recovery_score >= 4
          and variables.bull_reentry_allowed
        set: BULL
        confirm: 3
      - when: state.trend_mode == 'RECOVERY' and variables.risk_off_score >= 5
        set: CAUTION
        confirm: 3

target:
  # 확정 BEAR는 모든 밸류에이션 판단보다 우선해 QQQ를 전부 비운다.
  - when: state.trend_mode == 'BEAR'
    weights:
      QQQ: 0%
      BIL: 100%

  # 밸류에이션 급락과 실제 가격 약세가 함께 확인된 주 방어 목표다.
  - when: state.defense_mode == 'DEFENSE'
    weights:
      QQQ: 50%
      BIL: 50%

  # 23번처럼 확정 BEAR를 기다리는 구조적 약세 구간에서도 QQQ를 절반으로 줄인다.
  - when: variables.structural_bear
    weights:
      QQQ: 50%
      BIL: 50%

  # 추세 회복 초기에는 QQQ를 80%까지만 허용한다.
  - when: state.trend_mode == 'RECOVERY'
    weights:
      QQQ: 80%
      BIL: 20%

  # 그 밖의 정상·주의·밸류에이션 WARNING 구간은 QQQ를 100% 보유한다.
  - weights:
      QQQ: 100%
      BIL: 0%

rebalance:
  # 목표 비중과 실제 비중의 최대 차이가 7.5%p 이상일 때만 주문한다.
  - check: daily
    when: target_deviation() >= 7.5%

execution:
  days: 1
