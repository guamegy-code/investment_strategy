strategy:
  id: buy-3dip-bil-delayed-recovery
  name: Buy 3 Dip Delayed Recovery 70-30 (a-b-c-d) [BIL]
  version: 1
  dsl_version: 1
  enabled: true

# Jointly optimized entries and delayed one-stage recovery unwinds.
assets:
  required: [QQQ, BIL]
  risk: [QQQ]

parameters:
  drop_b: -0.10
  drop_c: -0.20
  drop_d: -0.325
  recovery_stage_1: 0.075
  recovery_stage_2: -0.085
  recovery_stage_3: -0.175

state:
  stage:
    initial: 0
    rules:
      - when: >
          state.stage == 3
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.recovery_stage_3)
        set: 2

      - when: >
          state.stage == 2
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_d)
        set: 3

      - when: >
          state.stage == 2
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.recovery_stage_2)
        set: 1

      - when: >
          state.stage == 1
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_c)
        set: 2

      - when: >
          state.stage == 1
          and state.peak_price > 0
          and QQQ.close >= state.peak_price * (1 + parameters.recovery_stage_1)
        set: 0

      - when: >
          state.stage == 0
          and state.peak_price > 0
          and QQQ.close <= state.peak_price * (1 + parameters.drop_b)
        set: 1

  peak_price:
    initial: 0
    rules:
      - when: state.peak_price == 0
        set: "=QQQ.close"

      - when: changed(state.stage) and state.stage == 0
        set: "=QQQ.close"

      - when: state.stage == 0 and QQQ.close > state.peak_price
        set: "=QQQ.close"

target:
  - when: state.stage == 3
    weights:
      QQQ: 100%
      BIL: 0%

  - when: state.stage == 2
    weights:
      QQQ: 90%
      BIL: 10%

  - when: state.stage == 1
    weights:
      QQQ: 87%
      BIL: 13%

  - weights:
      QQQ: 70%
      BIL: 30%

rebalance:
  - when: changed(state.stage)
    days: 1

execution:
  days: 1
