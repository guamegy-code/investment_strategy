strategy:
  id: retirement-7030-band
  name: Retirement 70/30 Band
  version: 1
  dsl_version: 1
  # Set to true to include this independent strategy in the normal runner.
  enabled: false

assets:
  required: [QQQ, BND]
  risk: [QQQ]

target:
  - weights:
      QQQ: 70%
      BND: 30%

rebalance:
  - check: daily
    when: target_deviation() >= 5%

execution:
  days: 1
