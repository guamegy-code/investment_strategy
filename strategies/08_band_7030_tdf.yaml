strategy:
  id: band-7030-tdf
  name: 70/30 TDF
  version: 1
  dsl_version: 1
  # 이 독립 전략을 일반 실행 목록에 포함하려면 true로 설정한다.
  enabled: true

assets:
  required: [QQQ, TDF2050_PROXY]
  risk: [QQQ]

target:
  - weights:
      QQQ: 70%
      TDF2050_PROXY: 30%

rebalance:
  - check: daily
    when: target_deviation() >= 5%

execution:
  days: 1
