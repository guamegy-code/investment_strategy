readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18,<4",
    "dash-ag-grid>=32.3,<33",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24,<7",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "uvicorn>=0.30,<1",
    "yfinance>=0.2.54",
]

[tool.uv]
package = false
