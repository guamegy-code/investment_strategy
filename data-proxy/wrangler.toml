name = "investment-strategy-data-proxy"
main = "src/worker.js"
compatibility_date = "2026-09-13"

[[durable_objects.bindings]]
name = "NOTIFICATION_STATE"
class_name = "NotificationState"

[[durable_objects.bindings]]
name = "NOTIFICATION_JOBS"
class_name = "NotificationRecovery"

[[migrations]]
tag = "notification-recovery-v1"
new_sqlite_classes = ["NotificationState", "NotificationRecovery"]

[[durable_objects.bindings]]
name = "VALUATION_DATA"
class_name = "ValuationData"

[[migrations]]
tag = "shared-valuation-v1"
new_sqlite_classes = ["ValuationData"]

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

# Create a KV namespace and insert its ID before deployment:
#   npx wrangler kv namespace create MARKET_DATA
[[kv_namespaces]]
binding = "MARKET_DATA"
id = "72f4477a122b418b98b65bfc4ee4138e"

# Enable R2 in the Cloudflare dashboard, then restore this binding to use
# `investment-strategy-market-history` as the long-term gzip price archive.
# [[r2_buckets]]
# binding = "MARKET_HISTORY"
# bucket_name = "investment-strategy-market-history"

[vars]
# URL of the static site's strategies/manifest.json.
STRATEGY_MANIFEST_URL = "https://investment-strategy-3zy.pages.dev/strategies/manifest.json"
# Set this separately; never commit the value:
#   npx wrangler secret put NOTIFICATION_API_KEY
