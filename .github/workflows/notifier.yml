name: Notification security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test Worker recovery and website data recovery
        run: node --test data-proxy/test/*.js tests/web/*test.mjs

      - name: Install notifier dependency
        run: python -m pip install requests

      - name: Test notification configuration and scan current sources
        run: python -m unittest tests.core.test_notifier -v
