name: Notification security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notifier dependency
        run: python -m pip install requests

      - name: Test notification configuration and scan current sources
        run: python -m unittest tests.test_notifier -v
